name: RM2 Build

on:
  push:
  workflow_dispatch:

jobs:
  terms-app:
    name: Package the Terms app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile resources
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev-tools
          mkdir -p output/terms
          cd terms-app
          /usr/lib/qt6/libexec/rcc --binary -o ../output/terms/resources.rcc application.qrc
          cp manifest.json icon.png ../output/terms/
      - uses: actions/upload-artifact@v4
        with:
          name: terms-app
          path: output/terms
          if-no-files-found: error

  rm2:
    name: Build ghostwriter for reMarkable 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Test single-stroke text
        run: cargo test --manifest-path hershey-check/Cargo.toml

      # cross builds inside an older container image, so the binary does not
      # depend on newer glibc symbols than the tablet actually has.
      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target armv7-unknown-linux-gnueabihf --bin ghostwriter

      - name: Report binary details
        run: |
          BIN=target/armv7-unknown-linux-gnueabihf/release/ghostwriter
          ls -la "$BIN"
          echo "Highest GLIBC versions required:"
          strings "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-rm2
          path: target/armv7-unknown-linux-gnueabihf/release/ghostwriter
          if-no-files-found: error
